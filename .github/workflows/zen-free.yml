name: Zen Free

on:
  pull_request:
    paths: ["packages/zen-free/**", ".github/workflows/zen-free.yml"]
  push:
    branches: [main]
    paths: ["packages/zen-free/**", ".github/workflows/zen-free.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plugin tag on main, e.g. zen-free-v0.1.0
        required: true
      min_godwit:
        description: First released Godwit version supporting this plugin, e.g. 1.6.0
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GODWIT_CHECKOUT: ${{ github.workspace }}/.godwit-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
      - name: Require a tagged commit from main for releases
        if: github.event_name == 'workflow_dispatch'
        run: git merge-base --is-ancestor HEAD origin/main
      # Pin the host/API used by the real goja integration test.
      - uses: actions/checkout@v4
        with:
          repository: godwit-email/godwit
          ref: 4cacafebc431de5d9fd1bfbb7d8528dcef47b6f7
          path: .godwit-ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: .godwit-ci/go.mod
          cache-dependency-path: .godwit-ci/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install published SDK for releases
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/zen-free
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install packed SDK for source checks
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/zen-free
        run: |
          # shortcut: pack the pinned SDK until its first npm publication; no sibling imports.
          (cd "$GODWIT_CHECKOUT/sdk" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")
          sdk_version=$(node -p 'require("./package.json").devDependencies["@godwit/sdk"]')
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/godwit-sdk-$sdk_version.tgz"
      - run: npm run typecheck
        working-directory: packages/zen-free
      - run: bun test test
        working-directory: packages/zen-free
      - run: bun run build
        working-directory: packages/zen-free
      - name: Prepare release metadata and archive
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/zen-free
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MIN_GODWIT: ${{ inputs.min_godwit }}
        run: |
          bun scripts/release.ts "$RELEASE_TAG" "$MIN_GODWIT"
          tar -czf dist/zen-free.tar.gz -C dist index.js plugin.json
          cd dist
          sha256sum index.js plugin.json zen-free.tar.gz registry-plugin.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zen-free-dist
          path: packages/zen-free/dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zen-free-dist
          path: dist
      - name: Publish the verified release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          MIN_GODWIT: ${{ inputs.min_godwit }}
        run: |
          gh release create "$RELEASE_TAG" dist/index.js dist/plugin.json dist/zen-free.tar.gz dist/registry-plugin.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Zen Free $RELEASE_TAG" \
            --notes "Requires Godwit $MIN_GODWIT or later. Extract zen-free.tar.gz for manual installation. registry-plugin.json contains the registry entry and exact index.js checksum."
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
